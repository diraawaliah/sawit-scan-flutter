name: sawit_scanner
description: Pendeteksi kematangan buah sawit (offline, TFLite).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  image_picker: ^1.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  share_plus: ^10.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  table_calendar: ^3.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/sawit_mobilenetv2.tflite
    - assets/models/sawit_resnetv2.tflite
    - assets/models/labels.txt
    - assets/images/